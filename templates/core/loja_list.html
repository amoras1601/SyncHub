{% extends 'base.html' %}

{% block content %}
<h2>Lojas</h2>
<table>
    <thead><tr><th>Nome</th><th>Marketplace</th><th>External ID</th></tr></thead>
    <tbody>
    {% for l in lojas %}
        <tr>
            <td>{{ l.name }}</td>
            <td>{{ l.get_marketplace_display }}</td>
            <td>{{ l.external_id }}</td>
        </tr>
    {% empty %}
        <tr><td colspan="3">Nenhuma loja cadastrada.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
