{% extends 'base.html' %}

{% block content %}
<h2>Apagar Produto</h2>
<p>Tem certeza que deseja apagar <strong>{{ produto.title }}</strong> ({{ produto.sku }})?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn" type="submit">Apagar</button>
    <a class="btn secondary" href="{% url 'core:produto_detail' produto.pk %}">Cancelar</a>
 </form>
{% endblock %}
