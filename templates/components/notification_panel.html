<div class="card" style="padding:8px 12px">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
    <div style="font-weight:700">Notificações</div>
    <a href="#" class="muted">Marcar como lidas</a>
  </div>
  <div style="display:flex; flex-direction:column; gap:8px">
    {% for n in notifications %}
      <div style="padding:10px; border-radius:8px; background: {% if n.important %}var(--primary-50){% else %}var(--neutral-0){% endif %}; border:1px solid var(--neutral-100)">
        <div style="font-weight:600">{{ n.title }}</div>
        <div class="muted" style="font-size:13px">{{ n.body }}</div>
      </div>
    {% empty %}
      <div class="muted">Nenhuma notificação recente.</div>
    {% endfor %}
  </div>
</div>
