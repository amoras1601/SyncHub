<!DOCTYPE html>
<html lang="pt-br">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SyncHub</title>
    <link rel="stylesheet" href="{% static 'css/ui.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="https://unpkg.com/htmx.org@1.10.0"></script>
        <script>
            function openModal() {
                document.getElementById('overlay').classList.remove('hidden');
            }
            function closeModal() {
                document.getElementById('overlay').classList.add('hidden');
                document.getElementById('modal-body').innerHTML = ''; 
            }
            function toggleView() {
                const table = document.getElementById('table-view');
                const grid = document.getElementById('grid-view');
                const toggle = document.getElementById('toggle-view');
                if (grid.classList.contains('hidden')) {
                    grid.classList.remove('hidden');
                    table.classList.add('hidden');
                    toggle.textContent = 'Tabela';
                } else {
                    grid.classList.add('hidden');
                    table.classList.remove('hidden');
                    toggle.textContent = 'Grid';
                }
            }
            // When HTMX swaps content into the modal, ensure it's visible
            document.body.addEventListener('htmx:afterSwap', (e) => {
                const id = e.detail.target.id;
                if (id === 'modal-body') {
                    openModal();
                }
                // If a new product row was inserted into the table, close the modal
                if (id === 'produtos-tbody') {
                    // give a short delay so user sees the inserted row animation
                    setTimeout(() => closeModal(), 150);
                }
            });
            // close modal on ESC
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
            function toggleAvatarMenu() {
                const menu = document.getElementById('avatar-menu');
                if (!menu) return;
                menu.classList.toggle('hidden');
            }
            // close avatar menu when clicking outside
            document.addEventListener('click', (e) => {
                const menu = document.getElementById('avatar-menu');
                const avatar = document.getElementById('avatar-btn');
                if (!menu || !avatar) return;
                if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !avatar.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        </script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="logo">SH</div>
            <nav>
                <a href="/" title="Início" aria-label="Início" class="{% if request.path == '/' %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11.5L12 5l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <a href="/core/produtos/" title="Produtos" aria-label="Produtos" class="{% if '/core/produtos' in request.path %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 16V8a2 2 0 0 0-1-1.732l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.732l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <a href="/core/lojas/" title="Lojas" aria-label="Lojas" class="{% if '/core/lojas' in request.path %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 9.5L12 4l9 5.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <a href="/core/anuncios/" title="Anúncios" aria-label="Anúncios" class="{% if '/core/anuncios' in request.path %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 11v2a3 3 0 0 0 3 3h2l6 3V5L8 8H6a3 3 0 0 0-3 3z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
                <a href="/ml/" title="Mercado Livre" aria-label="Mercado Livre" class="{% if '/ml' in request.path %}active{% endif %}">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 13h2l3 6h8l3-6h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 6h10v4H7z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </nav>
            <div style="flex:1"></div>
            <div class="sidebar-footer">
                {% if request.user.is_authenticated %}
                    <div class="avatar" id="avatar-btn" onclick="toggleAvatarMenu()">{{ request.user.username|slice:":1"|upper }}</div>
                {% else %}
                    <a class="btn" href="{% url 'login' %}">Entrar</a>
                {% endif %}
                <a href="/accounts/profile/" class="mini-avatar" title="Perfil">G</a>
            </div>
        </aside>
        <div class="main">
            <div class="top-search">
                <div style="display:flex; align-items:center; gap:12px;">
                    <div style="width:36px; height:36px; border-radius:8px; background:linear-gradient(135deg,var(--primary-400),var(--primary-500)); display:flex; align-items:center; justify-content:center; color:white; font-weight:700">SH</div>
                    <div style="min-width:320px">
                        <input class="search-input" placeholder="Buscar produtos, lojas, anúncios..." />
                    </div>
                </div>
                <div class="top-actions">
                                        <div style="position:relative">
                                                <button class="btn ghost" aria-label="Notificações">
                                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M15 17H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 22a2 2 0 0 0 2-2H10a2 2 0 0 0 2 2z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 8a6 6 0 1 0-12 0v4l-2 2v1h16v-1l-2-2V8z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                                    {% if notifications %}
                                                        <span class="badge" style="margin-left:8px;">{{ notifications|length }}</span>
                                                    {% else %}
                                                        <span class="badge" style="margin-left:8px;">0</span>
                                                    {% endif %}
                                                </button>
                                        </div>
                    <div style="position:relative">
                        {% if request.user.is_authenticated %}
                            <div style="display:flex; gap:8px; align-items:center">
                                <div class="avatar" id="avatar-btn-top" onclick="toggleAvatarMenu()">{{ request.user.username|slice:":1"|upper }}</div>
                            </div>
                        {% endif %}
                        <div id="avatar-menu" class="hidden" style="position:absolute; right:0; margin-top:8px; background:var(--neutral-0); border-radius:8px; box-shadow:var(--shadow-3); overflow:hidden;">
                            <a class="btn ghost" href="{% url 'profile' %}" style="display:block; width:100%; text-align:left; padding:10px 14px;">Perfil</a>
                            <a class="btn ghost" href="{% url 'logout' %}" style="display:block; width:100%; text-align:left; padding:10px 14px;">Sair</a>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal overlay -->
            <div id="overlay" class="hidden" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.35); z-index:1200;">
                <div id="modal" style="width:min(760px,95%);">
                    <div id="modal-body"></div>
                </div>
            </div>
            <main style="flex:1;">
                <div class="container">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>
</body>
</html>
